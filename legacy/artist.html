<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil — VeVit Art</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <meta name="description" content="Profil umělce komunity VeVit Art — obor, lokalita, dovednosti, datum připojení a odkazy na sociální sítě a portfolio.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebPage",
        "@id": "https://vevit.art/artist.html#page",
        "name": "Profil umělce — VeVit Art",
        "url": "https://vevit.art/artist.html",
        "inLanguage": "cs",
        "isPartOf": { "@id": "https://vevit.art/#website" },
        "about": { "@id": "https://vevit.art/#organization" }
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Domů", "item": "https://vevit.art/" },
          { "@type": "ListItem", "position": 2, "name": "Naši umělci", "item": "https://vevit.art/list.html" },
          { "@type": "ListItem", "position": 3, "name": "Profil umělce", "item": "https://vevit.art/artist.html" }
        ]
      }
    ]
  }
  </script>
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="container">
      <a href="/" class="logo">VeVit <span>Art</span></a>
      <ul class="nav-links">
        <li><a href="/">Domů</a></li>
        <li><a href="/#artists">Nové tváře</a></li>
        <li><a href="/#about">O nás</a></li>
        <li><a href="/#contact">Zapojit se</a></li>
      </ul>
      <button class="mobile-toggle" aria-label="Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
    <div class="mobile-menu">
      <a href="/">Domů</a>
      <a href="/#artists">Nové tváře</a>
      <a href="/#about">O nás</a>
      <a href="/#contact">Zapojit se</a>
    </div>
  </nav>

  <main style="min-height: 100vh; padding-top: 96px; padding-bottom: 80px;">
    <div class="container" style="max-width: 1000px;">
      <a href="/list.html" class="back-link" id="back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Zpět na naše umělce
      </a>

      <div id="artist-detail"></div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer-inner">
      <div>
        <span class="footer-logo">VeVit <span>Art</span></span>
        <span class="footer-year">&copy; 2026</span>
      </div>
      <nav>
        <ul class="footer-links">
          <li><a href="/">Domů</a></li>
          <li><a href="/#artists">Nové tváře</a></li>
          <li><a href="/#about">O nás</a></li>
          <li><a href="/#contact">Kontakt</a></li>
        </ul>
      </nav>
      <div class="footer-credit">
        Projekt od <a href="https://vevit.cz" target="_blank">VeVit Technologies</a>
      </div>
    </div>
  </footer>

  <script src="/js/data.js"></script>
  <script>
    // Navbar scroll
    const navbar = document.querySelector('.navbar');
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 20);
    });

    // Mobile menu
    document.querySelector('.mobile-toggle').addEventListener('click', () => {
      document.querySelector('.mobile-menu').classList.toggle('open');
    });

    // Load artist detail
    const params = new URLSearchParams(window.location.search);
    const nick = params.get('nick');
    const artist = getArtistByNick(nick);
    const container = document.getElementById('artist-detail');

    if (!artist) {
      container.innerHTML = `
        <article class="join-cta fade-in">
          <h3 class="join-cta-title">Umělec nenalezen</h3>
          <p class="join-cta-text">Tento profil neexistuje. Podívejte se na ostatní umělce, nebo se k nám přidejte.</p>
          <a href="/list.html" class="btn-primary join-cta-btn">Zpět na naše umělce
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </a>
        </article>
      `;
    } else {
      document.title = `${artist.name} — VeVit Art`;
      const profileUrl = 'https://vevit.art/artist.html?nick=' + encodeURIComponent(artist.nick);
      container.innerHTML = `
        <article class="detail-grid">
          <figure class="detail-img">
            <img src="${artist.image}" alt="${artist.name}">
          </figure>
          <div>
            <span class="font-mono-label detail-field">${artist.fieldLabel}</span>
            <h1 class="detail-name">${artist.name}</h1>
            <p class="detail-desc">${artist.longDescription}</p>
            <div class="detail-meta">
              <div class="detail-meta-item">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                ${artist.location}
              </div>
              <div class="detail-meta-item">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                Členem od ${artist.joinDate}
              </div>
            </div>
            <div style="margin-bottom: 24px;">
              <p class="skills-title">Dovednosti</p>
              <ul class="skills-list">
                ${artist.skills.map(s => `<li class="skill-tag">${s}</li>`).join('')}
              </ul>
            </div>
            <a href="#" class="btn-primary" style="width: auto;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              Portfolio
            </a>
          </div>
        </article>
        <aside class="social-section">
          <p class="social-title">Sociální sítě</p>
          <nav class="social-links" aria-label="Sociální sítě umělce">
            <a href="#" class="social-link">Instagram</a>
            <a href="#" class="social-link">Twitter / X</a>
          </nav>
        </aside>
      `;

      // Inject structured data describing this artist so AI agents / search
      // engines can identify and cite the profile and its key entities.
      const person = {
        '@context': 'https://schema.org',
        '@type': ['Person', 'ProfilePage'],
        '@id': profileUrl,
        'name': artist.name,
        'url': profileUrl,
        'image': artist.image,
        'description': artist.longDescription,
        'jobTitle': artist.fieldLabel,
        'address': { '@type': 'PostalAddress', 'addressLocality': artist.location },
        'memberOf': { '@id': 'https://vevit.art/#organization' },
        'knowsAbout': artist.skills
      };
      const ld = document.createElement('script');
      ld.type = 'application/ld+json';
      ld.textContent = JSON.stringify(person);
      document.head.appendChild(ld);
    }

    // Scroll reveal animations
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  </script>
</body>
</html>
